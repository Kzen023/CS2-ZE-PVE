// Kzen-ZRPVE 配置文件
// 修改后需要重载插件或重启服务器才会读取。
// 布尔值支持：1/0、true/false、yes/no、on/off。
// 时间单位为秒，距离单位为 CS2 地图单位。

// 总开关：0=关闭本插件的 PvE 管理，1=开启。
enabled = 1

// Bot 人数配置：按真人玩家人数选择档位；人数指真人，不含 Bot。
// solo：1 名真人时的 Bot 数量。
solo_bot_quota = 10
// duo：2 名真人时的 Bot 数量。
duo_bot_quota = 10
// coop：3-6 名真人时，Bot 数量按真人数 x2 计算，并限制在最小值和最大值之间。
coop_min_bot_quota = 6
coop_max_bot_quota = 12
// group：7 名及以上真人时，Bot 数量按真人数 x2 计算，并限制在最小值和最大值之间。
group_min_bot_quota = 12
group_max_bot_quota = 18

// 回合、感染与购买设置。
// 母体感染倒计时长度。
infection_delay = 16.0
// ze_ 开头地图的回合时长，单位为分钟。
ze_roundtime_minutes = 60.0
// 非 ze_ 开头地图的回合时长，单位为分钟；2.5 即 2 分 30 秒。
non_ze_roundtime_minutes = 2.5
// 购买时间，写 9999 表示近似无限购买时间。
buytime_seconds = 9999
// 1=全地图可购买，0=遵守地图购买区域。
buy_anywhere = 1
// 插件分批创建 Bot 时，每批/次操作之间的延迟；增大可减轻瞬时负载。
bot_add_delay = 0.2
// 感染释放后延迟整理现有僵尸 Bot 的时间。
release_move_delay = 1.0
// 预留设置：当前源码未使用，修改不会影响开局恢复。
initial_recovery_delay = 3.0
// 僵尸 Bot 重生后等待多久再尝试路线恢复。
respawn_recovery_delay = 3.0

// 真人 CT 路径记录：只记录存活且落地的真人 CT 位置。
// 记录频率；值越小轨迹越密，定时检查也越频繁。
record_interval = 0.25
// 两个记录点至少相隔的距离；减小可让轨迹更密，但会更快达到点数上限。
record_distance = 128
// 最多保留的历史路径点数量；达到上限后淘汰较早的点。
max_path_points = 2048

// 僵尸 Bot 恢复：卡住或长时间未受伤时，尝试传送到真人历史路线附近的安全点。
// Bot 状态检查间隔。
watchdog_interval = 1.0
// 在检查周期内，位移小于该值视为可能卡住。
stuck_distance = 128
// 连续疑似卡住多久后触发恢复。
force_recovery_time = 8.0
// 多久未受到真人伤害后触发路线恢复。
no_damage_recovery_time = 10.0
// 恢复点与最近存活真人之间允许的最小/最大距离，避免贴脸传送或传得过远。
recovery_min_behind = 800
recovery_max_behind = 1600
// 仅使用最近多少秒内记录的路线点。
recovery_path_max_age = 60.0
// 成功恢复后，同一 Bot 的常规恢复冷却时间。
recovery_cooldown = 4.0
// Bot 受击后使用的恢复冷却时间，避免刚建立交战就连续传送。
hit_recovery_cooldown = 15.0
// 找不到合适安全点时，过多久再重试。
recovery_retry_delay = 2.0
// 查找路线点期间的重试间隔。
recovery_path_retry_delay = 1.0
// 查找路线点的最大重试次数。
recovery_path_retry_count = 6
// 恢复点被某个 Bot 选中后，暂时保留多久，减少多个 Bot 挤到同一点。
recovery_point_reservation_time = 5.0
// 候选恢复路线分组数量；主要用于分散 Bot 选点。
recovery_lane_count = 8
// 同一路线分组内，候选恢复点至少间隔的路径点数量。
recovery_lane_node_gap = 3

// 预留设置：Escort 跟随更新当前未启用，此项不会改变恢复点距离。
escort_release_distance = 800

// CS2 原生 Bot AI。
// Bot 难度：通常 0-3，具体行为受 CS2 游戏版本影响。
bot_difficulty = 3
// Bot 闲置状态下的视野距离。
bot_idle_vision_distance = 4096

// 插件应用到 CS2Fixes Zombie:Reborn 的设置。
// 是否启用燃烧弹/火焰对僵尸的效果。
zr_napalm_enable = 1
// 感染出生类型，具体编号含义以当前 CS2Fixes ZR 版本为准。
zr_infect_spawn_type = 1
// 是否提示感染出生方式。
zr_infect_spawn_warning = 1
// 回合结束时的默认获胜阵营编号，具体编号含义以当前 ZR 版本为准。
zr_default_winner_team = 3

// 调试与 Bot 状态显示。
// 调试信息 HUD；日常游玩建议关闭，排查问题时再开启。
debug_hud_enabled = 0
// 全体 Bot 状态面板；开启后按 status_hud_interval 刷新。
status_hud_enabled = 0
// 状态面板使用较大字号。
status_hud_large_text = 1
// 状态面板刷新间隔；过低会增加网络消息量。
status_hud_interval = 1.0
// 面板最多列出的 Bot 数量。
status_hud_max_bots = 8
// 是否把调试信息发到聊天栏；可能造成聊天刷屏，通常保持关闭。
debug_chat_enabled = 0
// 是否在服务器控制台输出调试信息。
debug_console_enabled = 1
// 调试 HUD 的显示时长。
debug_hud_duration = 4

// 以下参数在源码中属于旧版 Escort 跟随逻辑的预留项，目前没有接入运行流程：
// initial_recovery_delay、escort_update_interval、escort_node_radius、
// escort_progress_distance、escort_skip_time、escort_teleport_time、
// escort_give_up_time、escort_forward_move、escort_step_interval、
// escort_lane_count、escort_lane_node_gap。不要依赖它们调整当前行为。

